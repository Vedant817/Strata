name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Design lint first: it is milliseconds, and it is the rule that is
      # easiest to break by accident and hardest to notice in review.
      - name: Design lint
        run: npm run lint:design

      - name: Types and Astro diagnostics
        run: npm run check

      - name: Anchor resolution
        run: npm run test:anchors

      # Runnable code blocks are the one place this product executes code a reader
      # can change. The threat model gates the feature; these assertions are what
      # stop a later edit from quietly dropping the sandbox token list or the CSP.
      - name: Sandbox invariants
        run: npm run test:sandbox

      # Migration 0020 rebuilds the annotations table, and a rebuild in the wrong
      # order deletes every reaction a reader has left. The rehearsal plants
      # reactions on a pre-0020 schema and applies the real migration to it,
      # because "reactions survived" asserted against a seeded database is
      # asserted against zero rows and proves nothing.
      - name: Migration rehearsal
        run: npm run test:migration

      # Artifact props are the one place a writer-authored payload is coerced on
      # the way into a draft. The array case is not hypothetical: an earlier
      # scalar-only rule emptied the data in every existing curve and breakdown
      # on the next save.
      - name: Artifact prop coercion
        run: npx tsx scripts/check-artifact-props.ts

      # Archive import. The format assertions use fixtures shaped like the real
      # exports — Medium's three body containers, an unclosed <li>, Docs'
      # font-weight spans, a CSV field with an embedded newline — because an
      # import that returns the right words with every heading flattened has not
      # imported the post.
      - name: Import formats
        run: npm run test:import:formats

      # Draft Autopsy is three named sentences. The assertions are the cases
      # that must fire and the cases that must not, so a later tweak to the
      # jargon heuristic cannot quietly start nagging every code span.
      - name: Draft autopsy
        run: npm run test:autopsy

      - name: Audience simulator
        run: npm run test:audience

      # The formats added past v1: flashcards, thread outline, and the shape
      # breakdown. Two properties matter more than the content: a synthesis is a
      # published artefact so two runs must be byte-identical, and no card may
      # contain a sentence the writer did not write.
      - name: Synthesis formats
        run: npm run test:synthesis

      # The writer's first pass through the maintenance loop, §10.5. The assertion
      # that matters is that the diff the writer sees is the diff the reader gets
      # — same renderer, same props — because a guided flow that paraphrases the
      # payoff is a sales pitch, not the loop.
      - name: First loom
        run: npm run test:loom

      # The app, used badly: traversal, hostile queries, every API route against
      # three content types, private-page indexing, no-script rendering, and the
      # cache and compression promises checked against the bytes on the wire.
      # Found two live 500s — /api/notifications and /api/sessions both threw on
      # a non-form content type — plus six private pages missing noindex.
      - name: Hostile use
        run: npm run test:hostile

      # What a person does twice, not what an attacker does. Found the duplicate
      # reply: a double-clicked "Post reply" stored two identical public notes
      # pinned to someone else's sentence, with no way for the reader to undo it.
      - name: Accidental repeats
        run: npm run test:repeat

      # The privacy promise, measured. Found that "forget my reading history"
      # deleted receipts and events while three tables still carried the browser
      # id — including the reader's own note, which stayed visible on the article
      # under a page saying everything had been deleted.
      - name: Erasure
        run: npm run test:forget

      # 375px, both themes, 200% zoom, tap targets and keyboard focus — the half
      # of §2.4's definition of done that the design lint cannot see, because a
      # design system can satisfy every lint rule and still ship unreadable text.
      # Found --ink-3 at 3.89:1 in light and 3.69:1 in dark, and the lifecycle
      # colours failing as body text.
      - name: Viewports
        run: npm run test:viewports

      # Content the site does not control: §10.5 imports Medium, Hashnode, Google
      # Docs and WordPress archives, so a 200-character URL, right-to-left Arabic,
      # emoji or a bidi control in a title is Tuesday, not a contrived fixture.
      # Found an OG image that 500'd on bidi controls, and a 14-column table that
      # pushed the whole page to 4410px on a phone.
      - name: Content stress
        run: npm run test:content

      # What the app says when it refuses something. Five endpoints were putting
      # Zod's own complaint into a query string and rendering it on the page in
      # front of the reader: "Invalid input: expected string, received undefined".
      - name: Reader-facing errors
        run: npm run test:reader

      # Whether a hostile query string becomes markup. Separate from the hostile
      # pass because the answer is not in the bytes: these payloads are inert by
      # escaping, so the only way to tell an inert reflection from a live one is to
      # load it and see whether it ran. Real browser, real DOM, and a control case
      # proving the probe can detect live markup when it is there.
      - name: Reflection
        run: npm run test:xss

      - name: After-read recommendations
        run: npm run test:recommend

      - name: Ask citation cards
        run: npm run test:citation

      # WebAuthn parsing. This decoder reads attacker-supplied attestation bytes,
      # so its caps and its refusal paths are the security properties, and they
      # need proving on every build rather than when a keypress goes wrong.
      - name: WebAuthn CBOR and attestation parsing
        run: npx tsx scripts/check-webauthn-cbor.ts

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://strata.pub

      - name: Performance budget
        run: npm run perf:budget

      # Compression is what stands between a 138KB article and a reader on a slow
      # link, and the failure it guards against is invisible: the response is
      # still a valid 200 with all the right bytes, just uncompressed, so every
      # other check in this file passes while LCP doubles.
      - name: Response compression
        run: npm run test:compress

      # The plan's three numbers. Needs a browser, which ubuntu-latest has.
      # Kept last and after the build because it audits the built server: a perf
      # number measured against the dev server describes the dev server.
      - name: Field metrics (LCP / CLS / INP)
        run: npm run test:field

      # The return hook. Two claims that are not obvious from reading the code:
      # that the list is actually per-reader, and that one reader's history
      # cannot reach the next one. Driven through a browser because the caching
      # headers are part of the claim and only exist on the wire.
      - name: Constellation digest
        run: npm run test:digest

      # The database is a local libsql file and migrations run on first query,
      # so CI needs no service container. Seeding gives the route check real
      # posts to render rather than a wall of 404s. The smoke script boots the
      # built server itself, so there is nothing to start by hand here.
      - name: Seed
        run: npm run db:seed

      - name: Route smoke test
        run: npm run test:smoke

      # Import driven over HTTP as a real author, against the built server. This
      # is where the copy on /write#import gets checked rather than assumed: it
      # asserts that a heading survives all the way to the rendered page, that a
      # duplicate slug says so in words, and that an anonymous caller is refused.
      - name: Import API
        run: npm run test:import:api

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
